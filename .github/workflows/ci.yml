# .github/workflows/ci.yml
name: CI – Build and Push Docker Image

on:
  pull_request:
    branches:
      - develop

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 – Checkout Repository
        uses: actions/checkout@v3

      - name: Step 2 – Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Step 3 – Build Docker Image
        run: |
          docker build -t taskflow-app .

      - name: Step 4 – Tag Docker Image
        run: |
          docker tag taskflow-app ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-app:latest
          docker tag taskflow-app ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-app:${{ github.sha }}

      - name: Step 5 – Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-app:${{ github.sha }}